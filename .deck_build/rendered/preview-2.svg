<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4EFE4"/><text x="63.9999999984" y="59.9999999985" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="14.6666666663" font-weight="bold" fill="#31594C">01 / CORE LOOP</text><text x="63.9999999984" y="117.3333333304" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="39.999999998999996" font-weight="bold" fill="#171E20">A match unfolds in rounds</text><text x="63.9999999984" y="171.99999999569997" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="22.6666666661" font-weight="normal" fill="#57635E">Each round moves from preparation to action, then resolves effects before resources refresh.</text><rect x="146.666666663" y="250.66666666039998" width="981.3333333088" height="1.8666666666199998" rx="0" fill="#B9AE9A"/><text x="69.3333333316" y="237.3333333274" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="29.3333333326" font-weight="bold" fill="#31594C">01</text><text x="69.3333333316" y="282.66666665959997" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="26.666666665999998" font-weight="bold" fill="#31594C">Roll</text><text x="69.3333333316" y="321.99999999194995" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">Each player rolls 8</text><text x="69.3333333316" y="346.38666665800696" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">elemental dice and may</text><text x="69.3333333316" y="370.77333332406397" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">reroll once. Before the</text><text x="69.3333333316" y="395.159999990121" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">first round, players choose</text><text x="69.3333333316" y="419.546666656178" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">their initial active</text><text x="69.3333333316" y="443.933333322235" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">combatant.</text><text x="477.33333332139995" y="237.3333333274" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="29.3333333326" font-weight="bold" fill="#31594C">02</text><text x="477.33333332139995" y="282.66666665959997" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="26.666666665999998" font-weight="bold" fill="#31594C">Action</text><text x="477.33333332139995" y="321.99999999194995" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">Players alternate actions: use</text><text x="477.33333332139995" y="346.38666665800696" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">a skill, switch, play a card,</text><text x="477.33333332139995" y="370.77333332406397" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">tune a die, or end the round.</text><text x="477.33333332139995" y="395.159999990121" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">Costs are paid from the rolled</text><text x="477.33333332139995" y="419.546666656178" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">dice.</text><text x="895.9999999775999" y="237.3333333274" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="29.3333333326" font-weight="bold" fill="#31594C">03</text><text x="895.9999999775999" y="282.66666665959997" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="26.666666665999998" font-weight="bold" fill="#31594C">End phase</text><text x="895.9999999775999" y="321.99999999194995" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">Summons resolve, round</text><text x="895.9999999775999" y="346.38666665800696" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">effects refresh, and each</text><text x="895.9999999775999" y="370.77333332406397" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">player draws 2 cards. The</text><text x="895.9999999775999" y="395.159999990121" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">first player to end acts</text><text x="895.9999999775999" y="419.546666656178" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#171E20">first next round.</text><rect x="63.9999999984" y="525.3333333201999" width="1151.9999999712" height="1.06666666664" rx="0" fill="#D0C9BB"/><text x="66.666666665" y="569.3333333191" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="14.6666666663" font-weight="bold" fill="#31594C">WIN CONDITION</text><text x="66.666666665" y="615.9999999846" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="27.999999999299998" font-weight="bold" fill="#171E20">Defeat all three opposing combatants.</text><rect x="63.9999999984" y="671.9999999831999" width="1151.9999999712" height="0.9333333333099999" rx="0" fill="#D0C9BB"/><text x="63.9999999984" y="694.6666666492999" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="11.9999999997" font-weight="bold" fill="#57635E">GENIUS INVOKATION / PROJECT IDEA</text><text x="1213.9999999696" y="694.6666666492999" text-anchor="end" font-family="Aptos,Georgia,serif" font-size="11.9999999997" font-weight="bold" fill="#57635E">02 / 08</text></svg>