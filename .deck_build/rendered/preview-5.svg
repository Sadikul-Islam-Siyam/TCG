<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#182927"/><text x="63.9999999984" y="59.9999999985" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="14.6666666663" font-weight="bold" fill="#D6B56F">04 / AI ARCHITECTURE</text><text x="63.9999999984" y="117.3333333304" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="39.999999998999996" font-weight="bold" fill="#F4EBDD">Algorithms that drive decisions</text><text x="63.9999999984" y="159.999999996" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="21.3333333328" font-weight="normal" fill="#AEB9B0">The AI proposes a move; the rules engine checks and resolves it.</text><rect x="69.3333333316" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="#243633"/><rect x="69.3333333316" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="none" stroke="#D6B56F" stroke-width="1.5"/><text x="185.3333333287" y="219.9999999945" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="18.666666666199998" font-weight="bold" fill="#F4EBDD">Visible state</text><rect x="370.66666665739996" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="#243633"/><rect x="370.66666665739996" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="none" stroke="#D6B56F" stroke-width="1.5"/><text x="486.6666666545" y="219.9999999945" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="18.666666666199998" font-weight="bold" fill="#F4EBDD">Legal moves</text><rect x="671.9999999831999" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="#243633"/><rect x="671.9999999831999" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="none" stroke="#D6B56F" stroke-width="1.5"/><text x="787.9999999803" y="219.9999999945" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="18.666666666199998" font-weight="bold" fill="#F4EBDD">Search and score</text><rect x="973.333333309" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="#243633"/><rect x="973.333333309" y="189.3333333286" width="231.99999999419998" height="50.666666665399994" rx="12" fill="none" stroke="#D6B56F" stroke-width="1.5"/><text x="1089.3333333061" y="219.9999999945" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="18.666666666199998" font-weight="bold" fill="#F4EBDD">Apply action</text><text x="331.9999999917" y="221.33333332779998" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="26.666666665999998" font-weight="bold" fill="#D6B56F">&gt;</text><text x="633.3333333175" y="221.33333332779998" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="26.666666665999998" font-weight="bold" fill="#D6B56F">&gt;</text><text x="934.6666666433" y="221.33333332779998" text-anchor="middle" font-family="Aptos,Georgia,serif" font-size="26.666666665999998" font-weight="bold" fill="#D6B56F">&gt;</text><rect x="69.3333333316" y="269.3333333266" width="527.9999999867999" height="1.06666666664" rx="0" fill="#69766D"/><text x="69.3333333316" y="301.99999999244994" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="21.999999999449997" font-weight="bold" fill="#F0D99F">Fuzzy logic - Easy</text><text x="69.3333333316" y="333.99999999164993" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">HP, energy, dice and hand size become low / medium</text><text x="69.3333333316" y="356.81333332441295" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">/ high signals. Rules adjust aggression, defence,</text><text x="69.3333333316" y="379.626666657176" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">burst and tempo priorities.</text><rect x="666.6666666499999" y="269.3333333266" width="527.9999999867999" height="1.06666666664" rx="0" fill="#69766D"/><text x="666.6666666499999" y="301.99999999244994" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="21.999999999449997" font-weight="bold" fill="#F0D99F">A* lethal planner - Normal + Hard</text><text x="666.6666666499999" y="333.99999999164993" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">Ranks lethal lines with f(n)=g(n)+h(n): g tracks</text><text x="666.6666666499999" y="356.81333332441295" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">resource spend; h estimates the damage still</text><text x="666.6666666499999" y="379.626666657176" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">needed.</text><rect x="69.3333333316" y="393.33333332349997" width="527.9999999867999" height="1.06666666664" rx="0" fill="#69766D"/><text x="69.3333333316" y="425.99999998935" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="21.999999999449997" font-weight="bold" fill="#F0D99F">Alpha-beta - Normal + Hard</text><text x="69.3333333316" y="457.99999998855" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">Iterative-deepening minimax looks at replies and</text><text x="69.3333333316" y="480.813333321313" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">prunes weaker branches. Hard uses it to shortlist</text><text x="69.3333333316" y="503.626666654076" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">candidate moves.</text><rect x="666.6666666499999" y="393.33333332349997" width="527.9999999867999" height="1.06666666664" rx="0" fill="#69766D"/><text x="666.6666666499999" y="425.99999998935" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="21.999999999449997" font-weight="bold" fill="#F0D99F">MCTS / UCT - Hard</text><text x="666.6666666499999" y="457.99999998855" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">Samples plausible hidden hands and deck orders,</text><text x="666.6666666499999" y="480.813333321313" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">then runs rollouts. UCT balances strong results</text><text x="666.6666666499999" y="503.626666654076" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">with exploring alternatives.</text><rect x="69.3333333316" y="517.3333333204" width="527.9999999867999" height="1.06666666664" rx="0" fill="#69766D"/><text x="69.3333333316" y="549.9999999862499" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="21.999999999449997" font-weight="bold" fill="#F0D99F">Constraint solving - Payments + decks</text><text x="69.3333333316" y="581.9999999854499" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">All-different assigns unique dice to cost slots;</text><text x="69.3333333316" y="604.8133333182129" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">MRV and forward checking prune choices. Sum</text><text x="69.3333333316" y="627.626666650976" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">constraints fill legal 30-card decks.</text><rect x="666.6666666499999" y="517.3333333204" width="527.9999999867999" height="1.06666666664" rx="0" fill="#69766D"/><text x="666.6666666499999" y="549.9999999862499" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="21.999999999449997" font-weight="bold" fill="#F0D99F">Evaluation + rules engine</text><text x="666.6666666499999" y="581.9999999854499" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">Scores HP, energy, board, dice and hand. The</text><text x="666.6666666499999" y="604.8133333182129" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">deterministic rules pipeline applies damage, aura</text><text x="666.6666666499999" y="627.626666650976" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="19.33333333285" font-weight="normal" fill="#E6E4DC">reactions, shields and status effects.</text><rect x="63.9999999984" y="671.9999999831999" width="1151.9999999712" height="0.9333333333099999" rx="0" fill="#69766D"/><text x="63.9999999984" y="694.6666666492999" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="11.9999999997" font-weight="bold" fill="#AEB9B0">GENIUS INVOKATION / PROJECT IDEA</text><text x="1213.9999999696" y="694.6666666492999" text-anchor="end" font-family="Aptos,Georgia,serif" font-size="11.9999999997" font-weight="bold" fill="#AEB9B0">05 / 08</text></svg>