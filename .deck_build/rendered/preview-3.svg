<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#182927"/><text x="63.9999999984" y="59.9999999985" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="14.6666666663" font-weight="bold" fill="#D6B56F">02 / RESOURCES</text><text x="63.9999999984" y="117.3333333304" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="39.999999998999996" font-weight="bold" fill="#F4EBDD">Decks, cards and elemental dice</text><text x="63.9999999984" y="171.99999999569997" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="22.6666666661" font-weight="normal" fill="#AEB9B0">A compact resource economy makes every action compete with the next one.</text><rect x="63.9999999984" y="206.6666666615" width="1151.9999999712" height="1.06666666664" rx="0" fill="#69766D"/><text x="71.9999999982" y="294.6666666593" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="57.33333333189999" font-weight="bold" fill="#F0D99F">30</text><text x="71.9999999982" y="338.6666666582" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="23.9999999994" font-weight="bold" fill="#F4EBDD">cards per deck</text><text x="71.9999999982" y="384.66666665705" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">At most 2 copies of a card.</text><text x="71.9999999982" y="409.053333323107" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">Players begin with 5 cards</text><text x="71.9999999982" y="433.439999989164" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">and can mulligan before play.</text><rect x="426.66666665599996" y="237.3333333274" width="1.06666666664" height="218.6666666612" rx="0" fill="#69766D"/><text x="477.33333332139995" y="294.6666666593" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="57.33333333189999" font-weight="bold" fill="#F0D99F">8</text><text x="477.33333332139995" y="338.6666666582" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="23.9999999994" font-weight="bold" fill="#F4EBDD">dice per round</text><text x="477.33333332139995" y="384.66666665705" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">Six elemental faces plus</text><text x="477.33333332139995" y="409.053333323107" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">Omni. Each player gets one</text><text x="477.33333332139995" y="433.439999989164" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">reroll before the action</text><text x="477.33333332139995" y="457.826666655221" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">phase.</text><rect x="831.9999999792" y="237.3333333274" width="1.06666666664" height="218.6666666612" rx="0" fill="#69766D"/><text x="881.3333333113" y="294.6666666593" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="57.33333333189999" font-weight="bold" fill="#F0D99F">1</text><text x="881.3333333113" y="338.6666666582" text-anchor="start" font-family="Georgia,Georgia,serif" font-size="23.9999999994" font-weight="bold" fill="#F4EBDD">die can be tuned</text><text x="881.3333333113" y="384.66666665705" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">Discard a card to convert one</text><text x="881.3333333113" y="409.053333323107" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">non-matching, non-Omni die</text><text x="881.3333333113" y="433.439999989164" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="20.66666666615" font-weight="normal" fill="#E6E4DC">into the active element.</text><rect x="63.9999999984" y="497.33333332089995" width="1151.9999999712" height="1.06666666664" rx="0" fill="#69766D"/><text x="66.666666665" y="546.666666653" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="14.6666666663" font-weight="bold" fill="#D6B56F">PAYING AN ACTION</text><text x="66.666666665" y="594.6666666517999" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="23.9999999994" font-weight="normal" fill="#E6E4DC">Element-matched dice or Omni satisfy aligned cost; unaligned cost accepts any remaining</text><text x="66.666666665" y="622.9866666510919" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="23.9999999994" font-weight="normal" fill="#E6E4DC">die.</text><rect x="63.9999999984" y="671.9999999831999" width="1151.9999999712" height="0.9333333333099999" rx="0" fill="#69766D"/><text x="63.9999999984" y="694.6666666492999" text-anchor="start" font-family="Aptos,Georgia,serif" font-size="11.9999999997" font-weight="bold" fill="#AEB9B0">GENIUS INVOKATION / PROJECT IDEA</text><text x="1213.9999999696" y="694.6666666492999" text-anchor="end" font-family="Aptos,Georgia,serif" font-size="11.9999999997" font-weight="bold" fill="#AEB9B0">03 / 08</text></svg>